<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#0066cc;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .login{
        background:white;
        padding:30px;
        border-radius:15px;
        width:350px;
        text-align:center;
        box-shadow:0 0 20px rgba(0,0,0,0.3);
    }

    h2{
        margin-bottom:20px;
        color:#0066cc;
    }

    input{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:1px solid #ccc;
        border-radius:8px;
    }

    button{
        width:100%;
        padding:12px;
        background:#0066cc;
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#004c99;
    }

    .erro{
        color:red;
        margin-top:10px;
    }

    #pagina51{
        display:none;
        width:100%;
        height:100vh;
        background:green;
        color:white;
        justify-content:center;
        align-items:center;
        font-size:80px;
        font-weight:bold;
        text-align:center;
    }
</style>
</head>

<body>

<div class="login" id="loginBox">
    <h2>Área de Login</h2>

    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <div class="erro" id="erro"></div>
</div>

<div id="pagina51">
    51 e pinga
</div>

<script>
function entrar() {
    const usuario = document.getElementById("usuario").value;
    const senha = document.getElementById("senha").value;

    if(usuario === "detru345" && senha === "12345"){
        document.getElementById("loginBox").style.display = "none";
        document.body.style.background = "green";
        document.getElementById("pagina51").style.display = "flex";
    } else {
        document.getElementById("erro").innerText =
            "Usuário ou senha incorretos!";
    }
}
</script>

</body>
</html>
